# Nginx: ziyaretçiyi karşılar, statik dosyaları kendisi verir, gerisini Gunicorn'a iletir.
# HTTPS satırlarını Certbot kendisi ekler.
# Kurulum: sudo cp deploy/nginx-ozaydin-dev.conf /etc/nginx/sites-available/ozaydin-dev
server {
    listen 80;
    listen [::]:80;
    server_name ozaydin.dev www.ozaydin.dev;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /srv/ozaydin-dev/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/ozaydin-dev/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
