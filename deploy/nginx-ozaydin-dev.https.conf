# Nginx (HTTPS, yayındaki ayar): ziyaretçiyi karşılar, statik dosyaları ve görselleri kendisi verir,
# gerisini Gunicorn'a (Django) iletir.
#
# Kurulum: sudo cp deploy/nginx-ozaydin-dev.https.conf /etc/nginx/sites-available/ozaydin-dev
#          sudo nginx -t && sudo systemctl reload nginx
#
# Certbot'un daha önce eklediği SSL satırları (sertifika yolları, options-ssl-nginx.conf, ssl-dhparams.pem)
# bu dosyada zaten var; dosyayı kopyalamak sertifikayı bozmaz. Sertifika yenileme (certbot renew) aynen çalışır.
# Eski, sadece HTTP'li şablon: deploy/nginx-ozaydin-dev.conf (ilk kurulumda Certbot'tan önce kullanılır).
#
# Güvenlik başlıklarının çoğunu (HSTS, X-Frame-Options, nosniff, Referrer-Policy, COOP) Django veriyor;
# burada tekrar edilmez. Nginx sadece Content-Security-Policy'yi (HTML'e) ve statik/medya başlıklarını ekler.
# Dikkat: bir location içinde add_header yazılınca üst bloktaki add_header'lar o location'a geçmez;
# bu yüzden başlıklar her location'da ayrı yazıldı.

# 1) http:// → https://ozaydin.dev (www dahil)
server {
    listen 80;
    listen [::]:80;
    server_name ozaydin.dev www.ozaydin.dev;
    server_tokens off;

    return 301 https://ozaydin.dev$request_uri;
}

# 2) https://www.ozaydin.dev → https://ozaydin.dev (kanonik adres: www'siz)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ozaydin.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/ozaydin.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ozaydin.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ozaydin.dev$request_uri;
}

# 3) Asıl site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ozaydin.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/ozaydin.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ozaydin.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Sıkıştırma (text/html her zaman dahil, listeye yazılmaz)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml
               application/rss+xml application/atom+xml application/manifest+json image/svg+xml;

    # Statik dosyalar: adları içerik özetli (site.3f2a1c.css), bu yüzden bir yıl önbellekte kalabilir.
    # (expires yerine tek bir Cache-Control başlığı: iki ayrı Cache-Control gönderilmesin.)
    location /static/ {
        alias /srv/ozaydin-dev/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Admin'den yüklenen görseller
    location /media/ {
        alias /srv/ozaydin-dev/media/;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
        # Yüklenen bir dosya (ör. SVG) tarayıcıda kod çalıştıramasın
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # media/ altında betik ya da HTML hiçbir zaman verilmez
    location ~* ^/media/.*\.(php|py|pl|cgi|sh|html?|xhtml|js|mjs)$ {
        deny all;
    }

    # Gizli dosyalar (.git, .env …) — Let's Encrypt doğrulama klasörü hariç
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Tarayıcıların kendiliğinden istediği ikon: Django'ya gitmeden diskten
    location = /favicon.ico {
        alias /srv/ozaydin-dev/staticfiles/core/icons/favicon.ico;
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Paylaşım görselleri (OG kartları): Django üretir ve önbellek başlığını kendisi koyar
    location /og/ {
        proxy_pass http://unix:/run/ozaydin-dev/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        add_header X-Content-Type-Options nosniff always;
    }

    # Geri kalan her şey Django'ya. Sayfalara Content-Security-Policy eklenir:
    # - script-src 'self': sayfada satır içi <script> çalışmaz (JSON-LD çalıştırılmadığı için etkilenmez)
    # - img-src data: base.html'deki SVG favicon için
    # - style-src 'unsafe-inline': şablonlardaki style="" öznitelikleri için
    # Django admin paneli de bu kurallarla çalışır (JS dosyaları harici).
    location / {
        proxy_pass http://unix:/run/ozaydin-dev/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    }
}
